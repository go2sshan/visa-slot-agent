name: visa-slot-monitor

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (GitHub may delay a few minutes at busy times)
  workflow_dispatch: {}       # "Run workflow" button for a manual check

permissions:
  contents: write             # to commit history + dashboard data

concurrency:
  group: visa-slot-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check slots, alert, update forecast
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m agent.main

      - name: Save history
        run: |
          git config user.name  "visa-slot-bot"
          git config user.email "visa-slot-bot@users.noreply.github.com"
          git add data docs/data.json
          git diff --cached --quiet || git commit -m "slots: $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase --autostash -q || true
          git push -q || true
